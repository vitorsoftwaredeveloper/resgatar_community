cleanupTransactions:
  handler: src/services/agents/cleanupTransactions.execute
  environment:
    DB: ${self:custom.environment.DB}
  events:
    - schedule:
        rate: cron(0 0 * * ? *)
        enabled: true

dailyLiturgy:
  handler: src/services/agents/dailyLiturgy.execute
  environment:
    FIREBASE_SERVICE_ACCOUNT: ${self:custom.environment.FIREBASE_SERVICE_ACCOUNT}
  events:
    - schedule:
        rate: cron(0 10 * * ? *)
        enabled: true

paymentDayReminder:
  handler: src/services/agents/paymentDayReminder.execute
  environment:
    DB: ${self:custom.environment.DB}
    FIREBASE_SERVICE_ACCOUNT: ${self:custom.environment.FIREBASE_SERVICE_ACCOUNT}
  events:
    - schedule:
        rate: cron(0 11 * * ? *)
        enabled: true

birthdayNotification:
  handler: src/services/agents/birthdayNotification.execute
  environment:
    DB: ${self:custom.environment.DB}
    FIREBASE_SERVICE_ACCOUNT: ${self:custom.environment.FIREBASE_SERVICE_ACCOUNT}
  events:
    - schedule:
        rate: cron(0 11 * * ? *)
        enabled: true

monthlyCommitments:
  handler: src/services/agents/monthlyCommitments.execute
  environment:
    DB: ${self:custom.environment.DB}
  events:
    - schedule:
        rate: cron(0 3 1 * ? *)
        enabled: true
