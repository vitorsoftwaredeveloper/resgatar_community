service: resgatar-community

frameworkVersion: "3"

custom:
  environment: ${file(./config/${self:provider.stage}.json):environment}
  esbuild: ${file(esbuild.config.js)}
  prune:
    automatic: true
    number: 0

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'hml'}
  timeout: 27
  environment:
    STAGE: ${self:provider.stage}
    DB: ${self:custom.environment.DB}

  httpApi:
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${self:custom.environment.COGNITO_URL}
        audience:
          - ${self:custom.environment.CLIENT_ID}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminRespondToAuthChallenge
        - cognito-idp:AdminGetUser
        - cognito-idp:ListUsers
      Resource:
        - ${self:custom.environment.COGNITO_USER_POOL_ARN}
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
      Resource:
        - arn:aws:s3:::${self:custom.environment.RECEIPTS_BUCKET_NAME}/*
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/resgatar_community/*
    # Necessário apenas quando o parâmetro for SecureString (KMS alias/aws/ssm).
    # Escopado por condição: só permite Decrypt via serviço SSM.
    - Effect: Allow
      Action:
        - kms:Decrypt
      Resource: "*"
      Condition:
        StringEquals:
          kms:ViaService: ssm.${aws:region}.amazonaws.com

plugins:
  - serverless-esbuild
  - serverless-prune-plugin

functions:
  - ${file(src/handlers/members/functions.yml)}
  - ${file(src/handlers/charges/functions.yml)}
  - ${file(src/handlers/contributions/functions.yml)}
  - ${file(src/handlers/expenses/functions.yml)}
  - ${file(src/handlers/balance/functions.yml)}
  - ${file(src/handlers/donations/functions.yml)}
  - ${file(src/handlers/notifications/functions.yml)}
  - ${file(src/handlers/videos/functions.yml)}
  - ${file(src/handlers/commitments/functions.yml)}
  - ${file(src/handlers/campaigns/functions.yml)}
  - ${file(src/handlers/webhook/functions.yml)}
  - ${file(src/services/agents/functions.yml)}

resources:
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
  Resources:
    ReceiptsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.environment.RECEIPTS_BUCKET_NAME}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - PUT
                - GET
              AllowedOrigins:
                - "*"
              AllowedHeaders:
                - "*"
              MaxAge: 3000
